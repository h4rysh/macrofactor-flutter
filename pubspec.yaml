name: sique
description: "Sique: Adherence-neutral nutritional coaching with metabolic expenditure modeling."
publish_to: 'none'

version: 2.0.0+20

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Icons & Styling
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # State Management & Reactive Architecture
  flutter_riverpod: ^2.5.1

  # Local Persistence & SQLite
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.3
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Authentication & Cloud Identity
  google_sign_in: ^6.2.2

  # Health Connect & Sensor Integration
  health: ^13.3.1

  # Utilities
  intl: ^0.19.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/foods/
    - assets/animations/
    - assets/metadata/
    - assets/database/
    - assets/data/

  fonts:
    - family: MacroSans
      fonts:
        - asset: assets/fonts/MacroSans-VF.ttf
        - asset: assets/fonts/MacroSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MacroSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MacroSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/MacroSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/MacroSans-Black.ttf
          weight: 900
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-VariableFont_opsz,wght.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
    - family: CustomIcon
      fonts:
        - asset: assets/fonts/CustomIcon.ttf
