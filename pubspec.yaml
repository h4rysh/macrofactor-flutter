name: macro_factor_app
description: "MacroFactor Clean-Room Reconstruction with HealthifyMe-grade Indian Food Database."
publish_to: 'none'

version: 1.4.2+7

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Icons & Styling
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  rive: ^0.13.4

  # State Management & Reactive Architecture
  flutter_riverpod: ^2.5.1

  # Local Persistence & Drift SQLite
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.3
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Network & APIs
  http: ^1.2.1
  google_generative_ai: ^0.4.0

  # Authentication & Cloud Identity
  google_sign_in: ^6.2.2

  # Health Connect & Sensor Integration
  health: ^13.3.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/foods/
    - assets/animations/
    - assets/metadata/
    - assets/database/

  fonts:
    - family: MacroSans
      fonts:
        - asset: assets/fonts/MacroSans-VF.ttf
        - asset: assets/fonts/MacroSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MacroSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MacroSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/MacroSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/MacroSans-Black.ttf
          weight: 900
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-VariableFont_opsz,wght.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
    - family: CustomIcon
      fonts:
        - asset: assets/fonts/CustomIcon.ttf
